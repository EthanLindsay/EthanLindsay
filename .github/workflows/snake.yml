
# Save this file at: .github/workflows/snake.yml
# in your profile repository (github.com/EthanLindsay/EthanLindsay)
#
# The snake image in your README does not exist until this Action runs.
# After committing, go to the Actions tab and run it once manually.
 
name: Generate Contribution Snake
 
on:
  schedule:
    - cron: "0 */12 * * *"   # regenerate twice a day
  workflow_dispatch:          # lets you trigger it by hand
  push:
    branches:
      - main
 
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
 
    permissions:
      contents: write
 
    steps:
      - name: Generate snake images
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
 
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
